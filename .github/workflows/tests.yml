name: Tests
permissions:
  contents: read
on:
  push:
  pull_request:
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  host-inventory:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.hosts.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - id: hosts
        run: python tests/check_hosts.py --github-output "$GITHUB_OUTPUT"

  native:
    name: Real editor ${{ matrix.host.host_version }} / Python ${{ matrix.host.python }} (${{ matrix.os }})
    needs: host-inventory
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.host-inventory.outputs.matrix).include }}
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      TMPDIR: ${{ matrix.os == 'macos-latest' && '/private/tmp' || '/tmp' }}
      PYTHONDONTWRITEBYTECODE: '1'
      CARGO_TARGET_DIR: ${{ github.workspace }}/runyte-target
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: runyte/runyte
          ref: ${{ matrix.host.revision }}
          path: runyte
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.host.python }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runyte -> ../runyte-target
          key: native-${{ matrix.host.revision }}-${{ matrix.host.host_version }}
      - name: Verify immutable host checkout
        env:
          EXPECTED_REVISION: ${{ matrix.host.revision }}
        run: test "$(git -C runyte rev-parse HEAD)" = "$EXPECTED_REVISION"
      - name: Prepare the declared host
        id: candidate
        run: python runyte/docs/plugins/compatibility/candidate.py --source runyte --destination "$RUNNER_TEMP/runyte-candidate" --github-output "$GITHUB_OUTPUT"
      - name: Verify host construction
        env:
          ACTUAL_VERSION: ${{ steps.candidate.outputs.host_version }}
          ACTUAL_MODE: ${{ steps.candidate.outputs.mode }}
          EXPECTED_VERSION: ${{ matrix.host.host_version }}
          EXPECTED_MODE: ${{ matrix.host.mode }}
        run: |
          test "$ACTUAL_VERSION" = "$EXPECTED_VERSION"
          test "$ACTUAL_MODE" = "$EXPECTED_MODE"
      - run: cargo build --locked --manifest-path "${{ steps.candidate.outputs.source }}/Cargo.toml"
      - name: Require native test execution
        env:
          RUNYTE_BIN: ${{ github.workspace }}/runyte-target/debug/runyte
        run: |
          python tests/require_native.py --host-version '${{ matrix.host.host_version }}'
